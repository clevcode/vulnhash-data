name: Verify evidence data

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Validate every published batch offline
        shell: bash
        run: |
          shopt -s nullglob
          manifests=(batches/*.json)
          for manifest in "${manifests[@]}"; do
            python3 verifier/verify.py "$manifest"
          done
